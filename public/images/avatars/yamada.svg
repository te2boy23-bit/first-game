<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Luxury Penthouse Bar Night Bokeh -->
    <radialGradient id="luxBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2c1424"/>
      <stop offset="40%" stop-color="#180b15"/>
      <stop offset="80%" stop-color="#0d040a"/>
      <stop offset="100%" stop-color="#050104"/>
    </radialGradient>

    <!-- Realistic Skin Subsurface Scattering Gradients -->
    <linearGradient id="realSkin" x1="45%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#fff5f0"/>
      <stop offset="35%" stop-color="#ffebd9"/>
      <stop offset="65%" stop-color="#ffd5c2"/>
      <stop offset="90%" stop-color="#fca88f"/>
      <stop offset="100%" stop-color="#e8856c"/>
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e28770" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#c96048" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8c2e1b" stop-opacity="0"/>
    </linearGradient>

    <!-- Realistic Brown/Black Silky Hair Gradients -->
    <linearGradient id="realHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3d271d"/>
      <stop offset="30%" stop-color="#24140e"/>
      <stop offset="70%" stop-color="#140905"/>
      <stop offset="100%" stop-color="#080302"/>
    </linearGradient>
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6e4635" stop-opacity="0"/>
      <stop offset="45%" stop-color="#d49b7e" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#f5d6c6" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#d49b7e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6e4635" stop-opacity="0"/>
    </linearGradient>

    <!-- Realistic Hazel/Brown Iris -->
    <radialGradient id="realIris" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4935d"/>
      <stop offset="30%" stop-color="#8a4b22"/>
      <stop offset="70%" stop-color="#451f0b"/>
      <stop offset="95%" stop-color="#1a0802"/>
      <stop offset="100%" stop-color="#0d0300"/>
    </radialGradient>

    <!-- Realistic Glossy Lips -->
    <linearGradient id="realLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#e62e5c"/>
      <stop offset="85%" stop-color="#b8143d"/>
      <stop offset="100%" stop-color="#730520"/>
    </linearGradient>

    <!-- Silk/Lace Dress Gradient -->
    <linearGradient id="laceDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211d24"/>
      <stop offset="50%" stop-color="#120e14"/>
      <stop offset="100%" stop-color="#08060a"/>
    </linearGradient>

    <!-- Gold & Diamond Sparkle -->
    <linearGradient id="realGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#7a5707"/>
    </linearGradient>

    <!-- Camera Blur & Grain Filters -->
    <filter id="bokehBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="photoSkinSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 1. Background: Luxury Hotel Penthouse Suite & City Night Lights -->
  <rect width="600" height="600" fill="url(#luxBg)"/>

  <!-- Soft Camera Bokeh Circles (Golden, Amber, Magenta City Lights) -->
  <circle cx="100" cy="120" r="55" fill="#f59e0b" opacity="0.22" filter="url(#bokehBlur)"/>
  <circle cx="500" cy="100" r="70" fill="#ec4899" opacity="0.18" filter="url(#bokehBlur)"/>
  <circle cx="80" cy="450" r="80" fill="#fb7185" opacity="0.15" filter="url(#bokehBlur)"/>
  <circle cx="520" cy="420" r="65" fill="#ffd700" opacity="0.2" filter="url(#bokehBlur)"/>
  <circle cx="300" cy="70" r="40" fill="#ffffff" opacity="0.12" filter="url(#bokehBlur)"/>

  <!-- 2. Back Hair Layers (Voluminous Natural Flowing Dark Waves) -->
  <g id="backHair">
    <path d="M140 240 C100 320 80 460 130 580 C170 610 240 580 230 500 C200 420 190 320 220 250 Z" fill="url(#realHair)"/>
    <path d="M460 240 C500 320 520 460 470 580 C430 610 360 580 370 500 C400 420 410 320 380 250 Z" fill="url(#realHair)"/>
    <path d="M160 180 C110 250 110 400 150 510 C180 550 210 540 200 470 C180 380 180 280 220 200 Z" fill="#140905"/>
    <path d="M440 180 C490 250 490 400 450 510 C420 550 390 540 400 470 C420 380 420 280 380 200 Z" fill="#140905"/>
  </g>

  <!-- 3. Body: Realistic Neck, Smooth Shoulders, Seductive Cleavage & Lace Dress -->
  <g id="body">
    <!-- Smooth feminine shoulders and upper chest -->
    <path d="M220 330 C170 360 100 420 80 600 L520 600 C500 420 430 360 380 330 L360 280 L240 280 Z" fill="url(#realSkin)"/>

    <!-- Subtle realistic shadow under jawline onto neck -->
    <path d="M245 280 C245 325 270 355 300 355 C330 355 355 325 355 280 Z" fill="#e28770" opacity="0.7" filter="url(#photoSkinSoft)"/>

    <!-- Delicate realistic collarbones -->
    <path d="M225 365 C255 378 280 388 295 390" stroke="#e8856c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M375 365 C345 378 320 388 305 390" stroke="#e8856c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M230 363 C258 375 280 384 293 386" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M370 363 C342 375 320 384 307 386" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Photorealistic Cleavage Volume & Subtle Shading -->
    <!-- Left breast curve -->
    <path d="M190 480 C215 420 268 408 300 450 C285 510 220 540 190 480 Z" fill="#ffebd9" opacity="0.65" filter="url(#photoSkinSoft)"/>
    <!-- Right breast curve -->
    <path d="M410 480 C385 420 332 408 300 450 C315 510 380 540 410 480 Z" fill="#ffebd9" opacity="0.65" filter="url(#photoSkinSoft)"/>
    <!-- Center deep shadow line -->
    <path d="M300 430 C297 455 297 500 300 545" stroke="#b04d3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M300 442 C296 468 296 505 300 538" stroke="#702213" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Black Silk Lace Cocktail Slip Dress / Camisole -->
    <path d="M120 575 C160 500 220 470 290 480 C296 481 304 481 310 480 C380 470 440 500 480 575 L520 600 L80 600 Z" fill="url(#laceDress)"/>
    <!-- Realistic Lace Embroidery Details -->
    <path d="M140 560 Q160 540 180 560 Q200 540 220 560 Q240 540 260 560 Q280 540 300 560 Q320 540 340 560 Q360 540 380 560 Q400 540 420 560 Q440 540 460 560" stroke="#ff4d88" stroke-width="1.5" fill="none" opacity="0.7"/>
    <!-- Spaghetti Straps -->
    <path d="M195 445 L215 510" stroke="#120e14" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M405 445 L385 510" stroke="#120e14" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Dainty Gold Necklace with Ruby Teardrop Pendant -->
    <path d="M235 345 Q300 430 365 345" stroke="url(#realGold)" stroke-width="2" fill="none"/>
    <g transform="translate(300, 420)">
      <path d="M0 -7 L6 1 C6 5 3 9 0 11 C-3 9 -6 5 -6 1 Z" fill="#e11d48" filter="url(#softGlow)"/>
      <circle cx="-1.5" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- 4. Face Structure: Realistic Asian Female Aesthetic (卵型の綺麗な輪郭・自然な血色感) -->
  <g id="face">
    <!-- Face Contour -->
    <path d="M210 170 C198 235 205 290 250 330 C275 350 325 350 350 330 C395 290 402 235 390 170 C385 120 215 120 210 170 Z" fill="url(#realSkin)"/>

    <!-- Subtle Natural Cheek Blush (血色感チーク) -->
    <ellipse cx="235" cy="265" rx="35" ry="22" fill="#ff4d79" opacity="0.22" filter="url(#photoSkinSoft)"/>
    <ellipse cx="365" cy="265" rx="35" ry="22" fill="#ff4d79" opacity="0.22" filter="url(#photoSkinSoft)"/>

    <!-- Delicate Realistic Nose (筋の通った綺麗な鼻筋・ハイライト) -->
    <path d="M300 220 L297 265 L306 270" stroke="#e28770" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M294 269 C297 273 303 273 306 270" stroke="#c96048" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="289" cy="268" r="2" fill="#c96048" opacity="0.5"/>
    <circle cx="311" cy="268" r="2" fill="#c96048" opacity="0.5"/>
    <!-- Nose bridge highlight -->
    <path d="M299 225 L298 258" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <circle cx="299" cy="264" r="2" fill="#ffffff" opacity="0.75"/>

    <!-- 5. Realistic Seductive Eyes (潤んだヘーゼルブラウンの瞳・まつ毛・涙袋) -->
    <!-- Left Eye -->
    <g id="leftEyeReal">
      <!-- 涙袋 (Natural Aegyo-sal) -->
      <path d="M228 244 C242 250 262 250 274 242" stroke="#e28770" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M232 240 C245 244 260 244 270 238" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
      <!-- Sclera (Eye white with realistic shading) -->
      <path d="M222 230 C234 218 266 218 278 229 C268 238 234 238 222 230 Z" fill="#f8fafc"/>
      <path d="M222 230 C234 220 266 220 278 229" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
      <!-- Iris -->
      <ellipse cx="250" cy="228" rx="14" ry="13" fill="url(#realIris)"/>
      <ellipse cx="250" cy="228" rx="6.5" ry="6.5" fill="#080201"/>
      <!-- Iris details & reflections -->
      <circle cx="246" cy="223" r="3.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="255" cy="232" r="1.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="249" cy="227" r="1" fill="#fed7aa" opacity="0.8"/>
      <!-- Upper Eyelash (Delicate natural winged eyeliner & lashes) -->
      <path d="M218 230 C230 216 266 216 282 226" stroke="#180a05" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M280 226 L288 222" stroke="#180a05" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M240 217 L238 211" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M252 216 L253 210" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M264 218 L267 212" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Double eyelid crease -->
      <path d="M226 218 C238 209 262 209 274 216" stroke="#c96048" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Rose/Brown Eyeshadow -->
      <path d="M222 223 C235 210 265 210 280 220" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#photoSkinSoft)"/>
    </g>

    <!-- Right Eye -->
    <g id="rightEyeReal">
      <!-- 涙袋 -->
      <path d="M372 244 C358 250 338 250 326 242" stroke="#e28770" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M368 240 C355 244 340 244 330 238" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
      <!-- Sclera -->
      <path d="M378 230 C366 218 334 218 322 229 C332 238 366 238 378 230 Z" fill="#f8fafc"/>
      <path d="M378 230 C366 220 334 220 322 229" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
      <!-- Iris -->
      <ellipse cx="350" cy="228" rx="14" ry="13" fill="url(#realIris)"/>
      <ellipse cx="350" cy="228" rx="6.5" ry="6.5" fill="#080201"/>
      <circle cx="346" cy="223" r="3.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="355" cy="232" r="1.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="349" cy="227" r="1" fill="#fed7aa" opacity="0.8"/>
      <!-- Upper Eyelash -->
      <path d="M382 230 C370 216 334 216 318 226" stroke="#180a05" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M320 226 L312 222" stroke="#180a05" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M360 217 L362 211" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M348 216 L347 210" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M336 218 L333 212" stroke="#180a05" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Double eyelid crease -->
      <path d="M374 218 C362 209 338 209 326 216" stroke="#c96048" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Rose Eyeshadow -->
      <path d="M378 223 C365 210 335 210 320 220" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#photoSkinSoft)"/>
    </g>

    <!-- Natural Soft Feminine Eyebrows (パウダー眉風) -->
    <path d="M218 202 C235 188 265 192 280 200" stroke="#3d271d" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M382 202 C365 188 335 192 320 200" stroke="#3d271d" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- 6. Realistic Plump Glossy Lips (ぷるぷるリップ・自然な微笑み) -->
    <g id="realLips">
      <!-- Upper lip (M-shape) -->
      <path d="M278 296 C290 291 296 293 300 294 C304 293 310 291 322 296 C316 303 308 304 300 303 C292 304 284 303 278 296 Z" fill="url(#realLip)"/>
      <!-- Mouth separation line -->
      <path d="M280 298 C290 304 310 304 320 298" stroke="#4a0418" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Lower plump lip -->
      <path d="M280 299 C288 314 312 314 320 299 C314 318 286 318 280 299 Z" fill="url(#realLip)"/>
      <!-- Realistic Wet Gloss Highlights -->
      <ellipse cx="300" cy="309" rx="8" ry="3.5" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="292" cy="308" rx="3" ry="1.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="300" cy="296" r="1.5" fill="#ffffff" opacity="0.75"/>
    </g>

    <!-- Sexy Mole / Beauty Mark under right eye (泣きぼくろ) -->
    <circle cx="376" cy="254" r="1.8" fill="#381c14"/>
  </g>

  <!-- 7. Front Hair: Silky Dark Brown Wavy Layers Framing Face -->
  <g id="frontHairReal">
    <!-- Top Hair Volume -->
    <path d="M205 155 C230 85 370 85 395 155 C415 105 360 70 300 70 C240 70 185 105 205 155 Z" fill="url(#realHair)"/>
    <!-- Side Bangs & Soft Face Framing Strands -->
    <path d="M300 95 C285 145 235 180 200 220 C225 185 270 170 290 135 Z" fill="url(#realHair)"/>
    <path d="M300 95 C318 145 365 180 400 220 C375 185 330 170 310 135 Z" fill="url(#realHair)"/>
    <!-- Voluminous Side Waves sweeping over shoulders -->
    <path d="M205 190 C175 250 160 360 205 450 C220 480 230 490 215 515 C198 535 180 490 170 435 C150 330 165 230 205 190 Z" fill="url(#realHair)"/>
    <path d="M395 190 C425 250 440 360 395 450 C380 480 370 490 385 515 C402 535 420 490 430 435 C450 330 435 230 395 190 Z" fill="url(#realHair)"/>

    <!-- Silky Hair Gloss Sheen (天使の輪・艶ハイライト) -->
    <path d="M220 120 C255 100 345 100 380 120 C355 108 245 108 220 120 Z" fill="url(#hairSheen)"/>
    <path d="M235 132 C265 118 335 118 365 132 C345 124 255 124 235 132 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- 8. Subtle Instagram / SNS Photo Border & Badge -->
  <rect width="600" height="600" fill="none" stroke="#e11d48" stroke-width="6" rx="24"/>
  <g transform="translate(300, 562)">
    <rect x="-125" y="-18" width="250" height="34" rx="17" fill="#180b15" stroke="#ff4d79" stroke-width="2" filter="url(#softGlow)"/>
    <text x="0" y="5" fill="#ff7eb3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">
      ❤️ YAMADA • VERIFIED
    </text>
  </g>
</svg>