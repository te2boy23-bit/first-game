<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a0e2e"/>
      <stop offset="40%" stop-color="#240718"/>
      <stop offset="80%" stop-color="#12020c"/>
      <stop offset="100%" stop-color="#080006"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="45%" stop-color="#ff2a85"/>
      <stop offset="80%" stop-color="#9d0251"/>
      <stop offset="100%" stop-color="#4a0024"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffb3d9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="50%" stop-color="#ffe4dc"/>
      <stop offset="85%" stop-color="#ffd0c2"/>
      <stop offset="100%" stop-color="#fca898"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a24"/>
      <stop offset="50%" stop-color="#0f0c14"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="35%" stop-color="#d946ef"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3377"/>
      <stop offset="70%" stop-color="#e60050"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ff4081" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: Luxury Night Hotel Suite -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Bokeh & Romance Glow Circles -->
  <circle cx="90" cy="110" r="45" fill="#ff2a85" opacity="0.18" filter="url(#glow)"/>
  <circle cx="410" cy="90" r="60" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>
  <circle cx="60" cy="380" r="70" fill="#d946ef" opacity="0.12" filter="url(#glow)"/>
  <circle cx="430" cy="350" r="55" fill="#ff7eb3" opacity="0.2" filter="url(#glow)"/>

  <!-- Romantic Sparkles / Hearts in background -->
  <g opacity="0.65">
    <path d="M120 70 Q130 55 140 70 Q150 85 130 100 Q110 85 120 70 Z" fill="#ff4081" opacity="0.4" transform="scale(0.6) translate(60, 40)"/>
    <path d="M380 130 Q390 115 400 130 Q410 145 390 160 Q370 145 380 130 Z" fill="#ff7eb3" opacity="0.5" transform="scale(0.5) translate(380, 50)"/>
    <!-- Star sparkles -->
    <path d="M80 200 L85 215 L100 220 L85 225 L80 240 L75 225 L60 220 L75 215 Z" fill="#ffe4dc" opacity="0.7"/>
    <path d="M420 180 L423 190 L433 193 L423 196 L420 206 L417 196 L407 193 L417 190 Z" fill="#ffd700" opacity="0.75"/>
    <path d="M360 60 L363 70 L373 73 L363 76 L360 86 L357 76 L347 73 L357 70 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Back Hair (Luscious voluminous wavy hair) -->
  <path d="M110 200 C80 260 60 380 100 480 C130 520 200 500 190 440 C170 380 160 290 180 220 Z" fill="url(#hairGrad)"/>
  <path d="M390 200 C430 270 450 390 390 490 C350 530 280 490 300 420 C320 360 330 280 320 220 Z" fill="url(#hairGrad)"/>
  <path d="M140 120 C80 180 80 320 120 420 C140 460 170 470 160 410 C140 330 140 240 180 170 Z" fill="#9d0251"/>
  <path d="M360 120 C420 180 420 320 380 420 C360 460 330 470 340 410 C360 330 360 240 320 170 Z" fill="#9d0251"/>

  <!-- Body / Shoulders / Sultry Cleavage -->
  <g id="body">
    <!-- Neck & Shoulders -->
    <path d="M190 290 C150 320 90 370 70 500 L430 500 C410 370 350 320 310 290 L300 240 L200 240 Z" fill="url(#skinGrad)"/>

    <!-- Collarbone & Cleavage Shadows -->
    <!-- Delicate collarbones -->
    <path d="M190 310 C215 320 235 328 245 330" stroke="#fca898" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M310 310 C285 320 265 328 255 330" stroke="#fca898" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Seductive Cleavage Curve & Volume -->
    <!-- Left Breast curve -->
    <path d="M160 410 C180 360 225 350 250 385 C240 430 190 460 160 410 Z" fill="#ffe4dc" opacity="0.6"/>
    <!-- Right Breast curve -->
    <path d="M340 410 C320 360 275 350 250 385 C260 430 310 460 340 410 Z" fill="#ffe4dc" opacity="0.6"/>
    <!-- Deep Cleavage Shadow Line -->
    <path d="M250 365 C248 385 248 420 250 450" stroke="#e07d70" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M250 375 C246 395 246 425 250 445" stroke="#b04840" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Sultry Black Lace Slip Dress / Corset -->
    <path d="M100 480 C130 420 180 395 240 405 C246 406 254 406 260 405 C320 395 370 420 400 480 L420 500 L80 500 Z" fill="url(#dressGrad)"/>
    <!-- Lace trim on dress -->
    <path d="M120 465 Q135 450 150 465 Q165 450 180 465 Q195 450 210 465 Q225 450 240 465 Q255 450 270 465 Q285 450 300 465 Q315 450 330 465 Q345 450 360 465 Q375 450 390 465" stroke="#ff2a85" stroke-width="1.8" fill="none" opacity="0.6"/>
    <!-- Lace straps -->
    <path d="M165 375 L180 430" stroke="#1f1a24" stroke-width="5" stroke-linecap="round"/>
    <path d="M165 375 L180 430" stroke="#ff2a85" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M335 375 L320 430" stroke="#1f1a24" stroke-width="5" stroke-linecap="round"/>
    <path d="M335 375 L320 430" stroke="#ff2a85" stroke-width="1.2" stroke-dasharray="2 3"/>

    <!-- Sparkling Ruby Pendant Necklace hanging into cleavage -->
    <path d="M200 295 Q250 360 300 295" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <g transform="translate(250, 355)">
      <path d="M0 -8 L7 0 L0 12 L-7 0 Z" fill="#ff0055" filter="url(#softGlow)"/>
      <path d="M0 -6 L5 0 L0 9 L-5 0 Z" fill="#ff7eb3"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      <!-- Sparkle -->
      <path d="M0 -14 L2 -9 L7 -9 L3 -6 L5 -1 L0 -4 L-5 -1 L-3 -6 L-7 -9 L-2 -9 Z" fill="#ffd700" transform="scale(0.6) translate(-10, -10)"/>
    </g>
  </g>

  <!-- Neck Shadow -->
  <path d="M210 240 C210 270 230 295 250 295 C270 295 290 270 290 240 Z" fill="#fca898" opacity="0.7"/>

  <!-- Beautiful Anime Head / Face -->
