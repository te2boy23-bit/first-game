      <ellipse cx="208" cy="184" rx="7" ry="7" fill="#12020c"/>
      <!-- Glints & Heart Catchlight -->
      <circle cx="204" cy="179" r="3.5" fill="#ffffff"/>
      <circle cx="213" cy="188" r="2" fill="#ffffff" opacity="0.9"/>
