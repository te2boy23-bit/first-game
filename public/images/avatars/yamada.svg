      <!-- Soft Pink Eyeshadow -->
      <path d="M182 178 C192 165 218 165 230 176" stroke="#ff2a85" stroke-width="4" opacity="0.35" filter="url(#softGlow)" fill="none"/>
    </g>

    <!-- Right Eye (Seductive half-closed flirty gaze) -->
