    <!-- Face Contour (delicate feminine chin) -->
    <path d="M175 140 C165 195 170 240 210 275 C230 292 270 292 290 275 C330 240 335 195 325 140 C320 100 180 100 175 140 Z" fill="url(#skinGrad)"/>

    <!-- Cheeks Blush (Aroused / Flirty Pink Flush) -->
    <circle cx="195" cy="215" r="32" fill="url(#blushGrad)"/>
    <circle cx="305" cy="215" r="32" fill="url(#blushGrad)"/>

    <!-- Seductive Nose -->
    <path d="M250 200 L248 218 L254 220" stroke="#e07d70" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="254" cy="219" r="1.5" fill="#fca898"/>

    <!-- Glamorous Seductive Eyes -->
    <!-- Left Eye (Sultry half-lidded bedroom eyes) -->
    <g id="leftEye">
      <!-- Eyelash Top Curve (thick, winged cat-eye liner) -->
      <path d="M180 185 C190 170 215 168 228 178" stroke="#1f0a1d" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M228 178 L235 174" stroke="#1f0a1d" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Lower lash line -->
      <path d="M188 192 C200 198 218 196 226 186" stroke="#5c1d48" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Iris -->
