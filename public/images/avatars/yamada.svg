      <!-- Eyelash Top Curve (thick, winged cat-eye liner) -->
      <path d="M320 185 C310 170 285 168 272 178" stroke="#1f0a1d" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M272 178 L265 174" stroke="#1f0a1d" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Lower lash line -->
      <path d="M312 192 C300 198 282 196 274 186" stroke="#5c1d48" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Iris -->
      <ellipse cx="292" cy="184" rx="14" ry="12" fill="url(#eyeGrad)"/>
      <ellipse cx="292" cy="184" rx="7" ry="7" fill="#12020c"/>
      <!-- Glints & Heart Catchlight -->
      <circle cx="288" cy="179" r="3.5" fill="#ffffff"/>
      <circle cx="297" cy="188" r="2" fill="#ffffff" opacity="0.9"/>
      <!-- Double Eyelid Crease -->
      <path d="M315 174 C305 163 285 162 275 170" stroke="#c0607a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Soft Pink Eyeshadow -->
      <path d="M318 178 C308 165 282 165 270 176" stroke="#ff2a85" stroke-width="4" opacity="0.35" filter="url(#softGlow)" fill="none"/>
    </g>

    <!-- Perfectly arched seductive eyebrows -->
    <path d="M178 162 C192 148 218 152 232 160" stroke="#780d3a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M322 162 C308 148 282 152 268 160" stroke="#780d3a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Seductive Glossy Lips (Parted, Alluring Smirk) -->
    <g id="mouth">
      <!-- Upper Lip -->
      <path d="M232 245 C242 241 247 243 250 244 C253 243 258 241 268 245 C263 250 256 251 250 250 C244 251 237 250 232 245 Z" fill="url(#lipGrad)"/>
      <!-- Open mouth / pearly teeth peek -->
      <path d="M235 246 C243 251 257 251 265 246 C262 254 238 254 235 246 Z" fill="#3a0515"/>
      <path d="M242 247 C246 249 254 249 258 247 C256 248 244 248 242 247 Z" fill="#ffffff"/>
      <!-- Plump Lower Lip -->
      <path d="M234 248 C242 258 258 258 266 248 C262 262 238 262 234 248 Z" fill="url(#lipGrad)"/>
      <!-- Lip Gloss Highlights -->
      <ellipse cx="250" cy="254" rx="6" ry="2.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="243" cy="253" r="1.5" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Beauty Mark (泣きぼくろ - under right eye) -->
    <circle cx="316" cy="205" r="2" fill="#3a0d20"/>
  </g>

  <!-- Front Hair (Silky, flowing bangs, framing curls) -->
  <g id="frontHair">
    <!-- Top volume & bangs -->
    <path d="M170 125 C190 70 310 70 330 125 C350 85 300 55 250 55 C200 55 150 85 170 125 Z" fill="url(#hairGrad)"/>
    <!-- Center Parting / Flowing Bangs -->
    <path d="M250 80 C240 120 200 150 170 180 C190 155 230 140 245 110 Z" fill="url(#hairGrad)"/>
    <path d="M250 80 C265 120 300 150 330 175 C310 150 275 135 255 105 Z" fill="url(#hairGrad)"/>
    <!-- Seductive Side Tendrils (curling past cheeks & collarbone) -->
    <path d="M170 150 C150 200 140 280 175 350 C185 370 195 380 185 395 C175 410 160 380 150 340 C130 260 140 180 170 150 Z" fill="url(#hairGrad)"/>
    <path d="M330 150 C350 200 360 280 325 350 C315 370 305 380 315 395 C325 410 340 380 350 340 C370 260 360 180 330 150 Z" fill="url(#hairGrad)"/>
    
    <!-- Hair Gloss / Halo Highlights -->
    <path d="M185 95 C215 80 285 80 315 95 C295 85 205 85 185 95 Z" fill="url(#hairHighlight)"/>
    <path d="M195 105 C220 95 280 95 305 105 C285 98 215 98 195 105 Z" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Seductive Forearm / Hand holding Champagne Glass -->
  <g id="handAndGlass" transform="translate(30, 20)">
    <!-- Champagne Glass -->
    <g transform="translate(340, 310)">
      <!-- Champagne liquid glowing -->
      <path d="M10 20 L35 20 L30 65 C28 75 17 75 15 65 Z" fill="#ffd700" opacity="0.75" filter="url(#softGlow)"/>
      <!-- Glass Outline -->
      <path d="M5 10 L40 10 L33 70 C30 85 15 85 12 70 Z" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
      <!-- Stem & Base -->
      <path d="M22.5 83 L22.5 130" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
      <ellipse cx="22.5" cy="130" rx="18" ry="4" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
      <!-- Bubbles -->
      <circle cx="20" cy="50" r="1.5" fill="#ffffff"/>
      <circle cx="26" cy="40" r="2" fill="#ffffff"/>
      <circle cx="18" cy="30" r="1.5" fill="#ffffff"/>
      <circle cx="28" cy="22" r="1.2" fill="#ffffff"/>
    </g>
    <!-- Feminine Hand & Manicured Red Nails -->
    <path d="M375 420 C365 390 350 380 345 385 C340 390 350 410 360 440 Z" fill="url(#skinGrad)"/>
    <path d="M345 385 C340 375 350 365 358 375 L368 400" stroke="#ffd0c2" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Red Manicure -->
    <circle cx="344" cy="378" r="2.5" fill="#ff0055"/>
    <circle cx="352" cy="368" r="2.5" fill="#ff0055"/>
  </g>

  <!-- Foreground Vignette & Neon Cyber Romance Border -->
  <rect width="500" height="500" fill="none" stroke="url(#hairGrad)" stroke-width="8" rx="20"/>
  
  <!-- "ROMANCE SCAM / HONEY TRAP" Badge Overlay -->
  <g transform="translate(250, 465)">
    <rect x="-110" y="-16" width="220" height="30" rx="15" fill="#1f0212" stroke="#ff2a85" stroke-width="2" filter="url(#softGlow)"/>
    <text x="0" y="4" fill="#ff7eb3" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">
      💋 HONEY TRAP 💋
    </text>
  </g>
</svg>