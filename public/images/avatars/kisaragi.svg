      <stop offset="0%" stop-color="#2e0854"/>
      <stop offset="50%" stop-color="#140226"/>
      <stop offset="100%" stop-color="#05000a"/>
    </radialGradient>
    <linearGradient id="kisaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#7e22ce"/>
      <stop offset="85%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0136"/>
    </linearGradient>
    <linearGradient id="kisaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
