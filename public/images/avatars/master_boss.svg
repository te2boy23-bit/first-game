<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="masterGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgMaster)"/>
  <!-- Glowing Hexagonal Cyber Throne -->
  <polygon points="250,30 450,140 450,360 250,470 50,360 50,140" stroke="#ef4444" stroke-width="4" stroke-dasharray="16 8" fill="none" filter="url(#masterGlow)"/>
  <!-- Crown / Skull Monogram -->
  <path d="M200 80 L225 120 L250 70 L275 120 L300 80 L290 140 L210 140 Z" fill="url(#crownGrad)" filter="url(#masterGlow)"/>
  <!-- Phantom Cloak -->
  <path d="M80 480 Q250 220 420 480 Z" fill="#09090b" stroke="#dc2626" stroke-width="4"/>
  <!-- Masked Phantom Head -->
  <ellipse cx="250" cy="220" rx="75" ry="90" fill="#18181b"/>
  <!-- Glowing Crimson Cyber Visor -->
  <polygon points="175,200 325,200 310,240 250,260 190,240" fill="#dc2626" stroke="#fbbf24" stroke-width="3" filter="url(#masterGlow)"/>
  <circle cx="215" cy="220" r="8" fill="#ffffff"/>
  <circle cx="285" cy="220" r="8" fill="#ffffff"/>
  <!-- Badge -->
  <rect x="100" y="425" width="300" height="45" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="3" filter="url(#masterGlow)"/>
  <text x="250" y="455" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3">👑 PHANTOM • SUPREME</text>
</svg>