  <g transform="translate(300, 562)">
    <rect x="-125" y="-18" width="250" height="34" rx="17" fill="#180e03" stroke="#f59e0b" stroke-width="2" filter="url(#asukaGlow)"/>
    <text x="0" y="5" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">
