  <circle cx="70" cy="390" r="60" fill="#f59e0b" opacity="0.12" filter="url(#goldGlow)"/>
  <circle cx="430" cy="400" r="50" fill="#e11d48" opacity="0.15" filter="url(#goldGlow)"/>

  <!-- Back Glamorous Golden Hair -->
  <path d="M120 180 C70 250 50 370 90 480 C120 520 190 500 180 430 C160 370 150 280 180 200 Z" fill="url(#asukaHair)"/>
  <path d="M380 180 C430 250 450 370 410 480 C380 520 310 500 320 430 C340 370 350 280 320 200 Z" fill="url(#asukaHair)"/>

  <!-- Body / Sultry Off-Shoulder Gold Silk Gown -->
  <path d="M190 280 C150 310 90 360 70 500 L430 500 C410 360 350 310 310 280 L300 230 L200 230 Z" fill="url(#asukaSkin)"/>

  <!-- Collarbones & Cleavage -->
  <path d="M195 300 C215 310 235 318 245 320" stroke="#fca87c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M305 300 C285 310 265 318 255 320" stroke="#fca87c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Cleavage Volume Curves -->
  <path d="M165 390 C185 345 228 335 250 370 C240 420 190 445 165 390 Z" fill="#ffebd9" opacity="0.6"/>
  <path d="M335 390 C315 345 272 335 250 370 C260 420 310 445 335 390 Z" fill="#ffebd9" opacity="0.6"/>
  <path d="M250 355 C248 375 248 410 250 435" stroke="#d97745" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Plunging Golden Silk Dress -->
  <path d="M90 480 C120 405 180 380 240 390 C246 391 254 391 260 390 C320 380 380 405 410 480 L430 500 L70 500 Z" fill="url(#goldDress)"/>
  <path d="M180 395 Q250 440 320 395" stroke="#ffe066" stroke-width="3" fill="none" filter="url(#goldGlow)"/>

  <!-- Diamond Choker -->
  <path d="M205 270 Q250 290 295 270" stroke="#ffd700" stroke-width="4" fill="none"/>
  <circle cx="250" cy="281" r="5" fill="#38bdf8" filter="url(#goldGlow)"/>
  <circle cx="250" cy="281" r="2.5" fill="#ffffff"/>

  <!-- Neck Shadow -->
  <path d="M210 230 C210 260 230 280 250 280 C270 280 290 260 290 230 Z" fill="#fca87c" opacity="0.6"/>

  <!-- Face / Beautiful Anime Head -->
  <g id="asukaFace">
    <path d="M175 130 C165 185 170 230 210 265 C230 282 270 282 290 265 C330 230 335 185 325 130 C320 90 180 90 175 130 Z" fill="url(#asukaSkin)"/>

    <!-- Cheek Blush -->
    <circle cx="195" cy="205" r="30" fill="url(#asukaBlush)"/>
    <circle cx="305" cy="205" r="30" fill="url(#asukaBlush)"/>

    <!-- Nose -->
    <path d="M250 190 L248 208 L253 210" stroke="#d97745" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Captivating Blue Eyes (Honey Trap Influencer Gaze) -->
    <!-- Left Eye -->
    <g transform="translate(0, -5)">
      <path d="M180 180 C190 165 215 163 228 173" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M188 187 C200 193 218 191 226 181" stroke="#44403c" stroke-width="2" stroke-linecap="round" fill="none"/>
      <ellipse cx="208" cy="179" rx="14" ry="12" fill="url(#blueEyes)"/>
      <ellipse cx="208" cy="179" rx="7" ry="7" fill="#082f49"/>
      <circle cx="204" cy="174" r="3.5" fill="#ffffff"/>
      <circle cx="213" cy="183" r="2" fill="#ffffff"/>
      <path d="M185 169 C195 158 215 157 225 165" stroke="#ca8a04" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(0, -5)">
      <path d="M320 180 C310 165 285 163 272 173" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M312 187 C300 193 282 191 274 181" stroke="#44403c" stroke-width="2" stroke-linecap="round" fill="none"/>
      <ellipse cx="292" cy="179" rx="14" ry="12" fill="url(#blueEyes)"/>
      <ellipse cx="292" cy="179" rx="7" ry="7" fill="#082f49"/>
      <circle cx="288" cy="174" r="3.5" fill="#ffffff"/>
      <circle cx="297" cy="183" r="2" fill="#ffffff"/>
      <path d="M315 169 C305 158 285 157 275 165" stroke="#ca8a04" stroke-width="1.5" fill="none"/>
    </g>

