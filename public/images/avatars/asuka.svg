<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="asukaBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#380d3b"/>
      <stop offset="50%" stop-color="#19041f"/>
      <stop offset="100%" stop-color="#09000d"/>
    </radialGradient>
    <linearGradient id="asukaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd280"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="asukaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f5"/>
      <stop offset="50%" stop-color="#ffebd9"/>
      <stop offset="85%" stop-color="#ffd5b8"/>
      <stop offset="100%" stop-color="#fca87c"/>
    </linearGradient>
    <linearGradient id="goldDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="45%" stop-color="#b8860b"/>
      <stop offset="80%" stop-color="#785908"/>
      <stop offset="100%" stop-color="#3d2b00"/>
    </linearGradient>
    <linearGradient id="blueEyes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="asukaLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="asukaBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b8b" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ff6b8b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b8b" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
