  <!-- Front Hair Styling -->
  <path d="M170 115 C190 60 310 60 330 115 C350 75 300 45 250 45 C200 45 150 75 170 115 Z" fill="url(#asukaHair)"/>
  <path d="M250 70 C235 110 190 140 165 170 C185 145 225 130 245 100 Z" fill="url(#asukaHair)"/>
  <path d="M250 70 C265 110 310 140 335 170 C315 145 275 130 255 100 Z" fill="url(#asukaHair)"/>
  <path d="M170 140 C145 190 135 270 170 340 C180 360 190 370 180 385 C170 400 155 370 145 330 C125 250 135 170 170 140 Z" fill="url(#asukaHair)"/>
  <path d="M330 140 C355 190 365 270 330 340 C320 360 310 370 320 385 C330 400 345 370 355 330 C375 250 365 170 330 140 Z" fill="url(#asukaHair)"/>

  <!-- Cyber Glitch Ring & Badge -->
  <rect width="500" height="500" fill="none" stroke="url(#asukaHair)" stroke-width="8" rx="20"/>
  <g transform="translate(250, 465)">
    <rect x="-115" y="-16" width="230" height="30" rx="15" fill="#1c0724" stroke="#f59e0b" stroke-width="2" filter="url(#goldGlow)"/>
    <text x="0" y="4" fill="#ffd700" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">
      ✨ AI HONEY TRAP ✨
