    <path d="M322 153 C308 139 282 143 268 151" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Seductive Glossy Pink Smile -->
    <path d="M232 235 C242 231 247 233 250 234 C253 233 258 231 268 235 C263 241 256 242 250 241 C244 242 237 241 232 235 Z" fill="url(#asukaLip)"/>
    <path d="M234 238 C242 248 258 248 266 238 C262 251 238 251 234 238 Z" fill="url(#asukaLip)"/>
    <ellipse cx="250" cy="244" rx="5" ry="2" fill="#ffffff" opacity="0.8"/>

    <!-- Beauty mark on left cheek -->
    <circle cx="188" cy="215" r="1.8" fill="#451a03"/>
