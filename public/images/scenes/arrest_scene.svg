<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgArrest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="stampRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="patrolGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgArrest)"/>
  <!-- Flashing Blue/Red Siren beams -->
  <polygon points="0,0 250,450 0,450" fill="#3b82f6" opacity="0.3" filter="url(#patrolGlow)"/>
  <polygon points="800,0 550,450 800,450" fill="#ef4444" opacity="0.3" filter="url(#patrolGlow)"/>
  <!-- Police Tape -->
  <polygon points="-50,380 850,300 850,340 -50,420" fill="#facc15"/>
  <text x="400" y="340" fill="#000000" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="6">POLICE LINE DO NOT CROSS • 警視庁捜査本部 • POLICE LINE DO NOT CROSS</text>
  <!-- Handcuffs / Decisive Evidence Icon -->
  <circle cx="340" cy="180" r="45" fill="none" stroke="#e2e8f0" stroke-width="12"/>
  <circle cx="460" cy="180" r="45" fill="none" stroke="#e2e8f0" stroke-width="12"/>
  <rect x="385" y="172" width="30" height="16" rx="4" fill="#cbd5e1"/>
  <!-- Large BUSTED Stamp -->
  <g transform="rotate(-8 400 200)">
    <rect x="180" y="130" width="440" height="110" rx="16" fill="#7f1d1d" opacity="0.9" stroke="#ef4444" stroke-width="8" stroke-dasharray="16 6" filter="url(#patrolGlow)"/>
    <text x="400" y="205" fill="#fee2e2" font-family="Impact, sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="8">★ BUSTED ★</text>
    <text x="400" y="230" fill="#fca5a5" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle" letter-spacing="4">DECISIVE EVIDENCE SEIZED</text>
  </g>
</svg>