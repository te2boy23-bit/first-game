<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgHq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="hqGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgHq)"/>
  <!-- Cyber Command Screens -->
  <rect x="80" y="60" width="280" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <text x="220" y="100" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">TARGET SYNDICATE MAP</text>
  <circle cx="160" cy="160" r="30" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <circle cx="280" cy="170" r="25" stroke="#eab308" stroke-width="2" fill="none"/>
  <rect x="440" y="60" width="280" height="180" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <text x="580" y="100" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">CYBER INTELLIGENCE FEED</text>
  <text x="580" y="140" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">> OPERATION: UNDERCOVER</text>
  <text x="580" y="170" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">> 19 SUSPECTS FLAGGED</text>
  <!-- Main Badge & Title -->
  <rect x="180" y="290" width="440" height="110" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#hqGlow)"/>
  <text x="400" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">警視庁 サイバー潜入対策室</text>
  <text x="400" y="375" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle" letter-spacing="3">TOKYO METROPOLITAN CYBERCRIME HQ</text>
</svg>